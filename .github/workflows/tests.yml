name: Tests

on:
  push:
  pull_request:

jobs:
  ringbuf:
    # The event transport is the piece the whole host side rests on, and it
    # is testable without hardware: a failure here should be a two-second
    # answer on a runner rather than a reflash on someone's desk.
    name: Host-testable C (ring buffers, C sink, MIDI packet codec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the SPSC ring buffer tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
             -o /tmp/test_ringbuf tests/test_ringbuf.c src/shared/usbif_ringbuf.c
          /tmp/test_ringbuf
      - name: Build and run the UAC host byte ring tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
             -o /tmp/test_byte_ring tests/test_byte_ring.c src/shared/usbif_byte_ring.c
          /tmp/test_byte_ring
      - name: Build and run the C sink lifetime tests (usbif#43)
        # Real threads: a writer racing close() and free(). Plain, under
        # AddressSanitizer (a write into freed memory crashes), and under
        # ThreadSanitizer (the gate's ordering is a real happens-before).
        run: |
          SRCS="tests/test_pcm_sink.c src/shared/usbif_byte_ring.c"
          cc -std=c11 -Wall -Wextra -Werror -O2 -pthread -Isrc -o /tmp/test_pcm_sink $SRCS
          /tmp/test_pcm_sink
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -pthread -fsanitize=address,undefined \
             -Isrc -o /tmp/test_pcm_sink_asan $SRCS
          /tmp/test_pcm_sink_asan
          cc -std=c11 -Wall -Wextra -Werror -O1 -g -pthread -fsanitize=thread \
             -Isrc -o /tmp/test_pcm_sink_tsan $SRCS
          /tmp/test_pcm_sink_tsan
      - name: The C sink tests can fail (planted faults must be caught)
        # A race test that has never failed proves nothing. Each build plants
        # one fault in the gate; the test has to catch it or this step fails.
        run: |
          SRCS="tests/test_pcm_sink.c src/shared/usbif_byte_ring.c"
          for fault in USBIF_PCM_SINK_PLANT_NO_WAIT USBIF_PCM_SINK_PLANT_NO_TRYLOCK; do
            cc -std=c11 -Wall -Wextra -Werror -O1 -g -pthread -fsanitize=address,undefined \
               -Isrc -D$fault -o /tmp/test_pcm_sink_planted $SRCS
            if /tmp/test_pcm_sink_planted > /tmp/planted.log 2>&1; then
              cat /tmp/planted.log
              echo "planted fault $fault was NOT caught"; exit 1
            fi
            echo "planted fault $fault caught:"; grep -E "FAIL|ERROR: AddressSanitizer" /tmp/planted.log | head -3
          done
      - name: Build and run the USB-MIDI packet codec tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -Isrc \
             -o /tmp/test_midi_packets tests/test_midi_packets.c \
             src/shared/usbif_midi_packet.c
          /tmp/test_midi_packets

  patches:
    # The patch queue is only useful if it still applies. This catches the
    # drift that would otherwise be found by a developer mid-build.
    name: Patch queue applies to the pinned upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the MicroPython version the patches are written against
        run: |
          # Must match the version patches/ is written against. Moved to
          # v1.29.0 on 2026-09-09 with the workspace pin move: 1.29 restructured
          # MP_USBD_BUILTIN_DESC_CFG_LEN (an NCM term, TUD_CONFIG_DESC_LEN moved
          # last) and added an NCM descriptor block, so 0002 was re-derived
          # against it and no longer applies to v1.28.0.
          git clone --depth 1 --branch v1.29.0 \
            https://github.com/micropython/micropython.git /tmp/micropython
      - name: Apply, then reverse, the whole queue
        working-directory: /tmp/micropython
        run: |
          for p in "$GITHUB_WORKSPACE"/patches/*.patch; do
            echo "applying $(basename "$p")"
            git apply "$p"
          done
          for p in $(ls -r "$GITHUB_WORKSPACE"/patches/*.patch); do
            git apply --reverse "$p"
          done
          test -z "$(git status --porcelain)" || {
            echo "tree not pristine after reverse"; git status --porcelain; exit 1;
          }

  python:
    # The portable API and its backends, which is the half of this repository
    # that runs off-target -- 169 tests including the conformance suite every
    # backend is held to, and the guard that keeps `_usbif` out of examples
    # and docs. None of it ran on a runner before: the suite needs `events`
    # from the sibling `pydevices` checkout, so the job has to assemble the
    # same two-repo layout a developer has, and nobody had. A guardrail
    # nothing runs is decoration.
    name: Portable API and backends (CPython)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          path: usbif
      - uses: actions/checkout@v4
        with:
          repository: PyDevices/pydevices
          path: pydevices
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the suite
        working-directory: usbif
        run: python -m unittest discover -s tests -p "test_*.py" -v

  unix:
    # The only place mod_usbif.c is compiled on a runner: MicroPython's unix
    # port with usbif as a user C module. It also runs the c_sink() surface
    # (usbif#43) on the real interpreter, where the host side is absent and
    # the binding must say so rather than hand a usermod something to trust.
    name: MicroPython unix build with usbif
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: usbif
      - uses: actions/checkout@v4
        with:
          repository: PyDevices/pydevices
          path: pydevices
      - name: Check out MicroPython v1.29.0 (the version patches/ is written against)
        run: |
          git clone --depth 1 --branch v1.29.0 \
            https://github.com/micropython/micropython.git micropython
      - name: Build mpy-cross and the unix port with usbif
        run: |
          make -C micropython/mpy-cross -j4
          make -C micropython/ports/unix submodules
          make -C micropython/ports/unix -j4 \
            USER_C_MODULES="$GITHUB_WORKSPACE/usbif" MICROPY_PY_SSL=0
      - name: Run the c_sink surface check
        env:
          MICROPYPATH: ${{ github.workspace }}/usbif/lib:${{ github.workspace }}/pydevices/lib:${{ github.workspace }}/pydevices/utils
        run: micropython/ports/unix/build-standard/micropython usbif/tests/unix_c_sink.py
